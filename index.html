<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ylian's Math Tutoring</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #333;
        }
        input[type="text"] {
            width: 80%;
            padding: 12px;
            margin-top: 20px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 16px;
        }
        button {
            padding: 12px 24px;
            margin-left: 10px;
            border: none;
            border-radius: 5px;
            background-color: #0070f3;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0051a8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📐 Ylian's Math Tutoring</h1>
    <p>Enter an educational website URL below to launch your workspace.</p>
    
    <input type="text" id="urlInput" placeholder="https://example.com" value="https://example.com">
    <button onclick="launchProxy()">Launch</button>
</div>

<script>
function launchProxy() {
    let targetUrl = document.getElementById('urlInput').value.trim();
    
    if (targetUrl) {
        if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
            targetUrl = 'https://' + targetUrl;
        }
        
        window.location.href = '/proxy/' + targetUrl;
    }
}

document.getElementById('urlInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
        launchProxy();
    }
});
</script>

</body>
</html>
