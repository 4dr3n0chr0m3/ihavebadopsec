<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Portal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 400;
        }
        .search-container {
            width: 100%;
            max-width: 600px;
            padding: 0 20px;
            box-sizing: border-box;
        }
        input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1rem;
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 30px;
            color: #ffffff;
            outline: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: border 0.3s ease;
        }
        input:focus {
            border: 1px solid #555555;
        }
    </style>
</head>
<body>

    <h1>Web Portal</h1>
    <div class="search-container">
        <input type="text" id="urlInput" placeholder="Search or type a URL..." onkeydown="if(event.key === 'Enter') redirecttoProxy()">
    </div>

    <script>
        // REPLACE THIS URL with your live Render backend URL
        const BACKEND_URL = "https://onrender.com";

        function redirecttoProxy() {
            let input = document.getElementById('urlInput').value.trim();
            if (!input) return;

            // If it's not a direct URL, turn it into a Google search query
            if (!input.includes('.') || input.includes(' ')) {
                input = "https://google.com" + encodeURIComponent(input);
            } else if (!input.startsWith('http://') && !input.startsWith('https://')) {
                input = 'https://' + input;
            }

            // Ultraviolet encodes URLs using a specific format (framer/wisp/uv)
            // Redirecting directly to the backend service to let it process the site safely
            window.location.href = BACKEND_URL + "/uv/service/" + btoa(input);
        }
    </script>
</body>
</html>
