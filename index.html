<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <!-- In-Page DevTools (Useful for debugging on Chromebook) -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    
    <script src="/uv/uv.bundle.js" defer></script>
    <script src="/uv.config.js" defer></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: #e0e0e0; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }
        .app-container { 
            background: #1e1e1e; 
            width: 100%; 
            max-width: 400px; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border: 1px solid #333;
            position: relative;
        }
        h1 { 
            font-size: 1.4rem; 
            color: #888; 
            text-align: center; 
            margin-top: 0; 
            margin-bottom: 20px; 
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .display-screen { 
            background: #0a0a0a; 
            padding: 20px; 
            border-radius: 10px; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 1.8rem; 
            text-align: right; 
            min-height: 40px; 
            margin-bottom: 20px; 
            border: 1px solid #2a2a2a;
            overflow-x: hidden;
            word-break: break-all;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .key {
            background: #2c2c2c;
            border: none;
            padding: 20px 0;
            border-radius: 10px;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .key:hover { background: #3d3d3d; }
        .key.operator { background: #0070f3; }
        .key.operator:hover { background: #0056b3; }
        .key.clear { background: #d9383a; }
        .key.clear:hover { background: #b32d2f; }

        /* Secret Input Field - Looks like a subtle shadow/divider */
        .secret-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid #222;
            color: #444; /* Very dark text to blend in */
            text-align: center;
            font-size: 1rem;
            padding: 10px 0;
            margin-top: 20px;
            outline: none;
            transition: 0.3s;
            letter-spacing: 2px;
        }
        .secret-input:focus {
            border-bottom: 2px solid #0070f3;
            color: #fff; /* Reveals text clearly when actively typing */
        }

        #workspace { display: none; animation: fadeIn 0.4s ease-in; }
        .proxy-title { font-size: 1.2rem; color: #fff; margin-bottom: 15px; text-align: left;}
        .proxy-box { background: #151515; padding: 15px; border-left: 3px solid #0070f3; font-size: 0.9rem; margin-bottom: 20px; color: #aaa; }
        .controls { display: flex; flex-direction: column; gap: 12px; }
        input.url-input { padding: 14px; border-radius: 8px; border: 1px solid #444; background-color: #2a2a2a; color: #fff; font-size: 15px; outline: none;}
        input.url-input:focus { border-color: #0070f3; }
        button.action-btn { padding: 14px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .btn-launch { background-color: #0070f3; color: white; }
        .btn-launch:hover { background-color: #0056b3; }
        .btn-panic { background-color: #d9383a; color: white; }
        .btn-panic:hover { background-color: #b32d2f; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Calculator</h1>
    
    <div class="display-screen" id="display">0</div>

    <div class="keypad" id="keypad">
        <button class="key clear" onclick="pressKey('C')">C</button>
        <button class="key" onclick="pressKey('(')">(</button>
        <button class="key" onclick="pressKey(')')">)</button>
        <button class="key operator" onclick="pressKey('/')">÷</button>
        
        <button class="key" onclick="pressKey('7')">7</button>
        <button class="key" onclick="pressKey('8')">8</button>
        <button class="key" onclick="pressKey('9')">9</button>
        <button class="key operator" onclick="pressKey('*')">×</button>
        
        <button class="key" onclick="pressKey('4')">4</button>
        <button class="key" onclick="pressKey('5')">5</button>
        <button class="key" onclick="pressKey('6')">6</button>
        <button class="key operator" onclick="pressKey('-')">-</button>
        
        <button class="key" onclick="pressKey('1')">1</button>
        <button class="key" onclick="pressKey('2')">2</button>
        <button class="key" onclick="pressKey('3')">3</button>
        <button class="key operator" onclick="pressKey('+')">+</button>
        
        <button class="key" onclick="pressKey('0')" style="grid-column: span 2;">0</button>
        <button class="key" onclick="pressKey('.')">.</button>
        <button class="key operator" onclick="pressKey('=')">=</button>
    </div>

    <!-- Secret Password Field -->
    <input type="password" id="secretInput" class="secret-input" autocomplete="off">

    <div id="workspace">
        <div class="proxy-title">Educational Hub Unlocked</div>
        <div class="proxy-box">Enter destination to establish a secure tunnel. Standard proxy navigation enabled.</div>
        <div class="controls">
            <input type="text" id="urlInput" class="url-input" placeholder="https://x.com" autocomplete="off">
            <button class="action-btn btn-launch" onclick="launchWorkspace()">Launch Environment</button>
            <button class="action-btn btn-panic" onclick="triggerPanic()">Quick Exit (Panic)</button>
        </div>
    </div>
</div>

<script>
    let currentInput = '';
    let globalKeyBuffer = '';

    // Handles standard calculator math
    function pressKey(key) {
        const display = document.getElementById('display');

        if (key === 'C') {
            currentInput = '';
        } else if (key === '=') {
            try {
                currentInput = eval(currentInput).toString();
            } catch (e) {
                currentInput = 'Error';
            }
        } else {
            if (currentInput === 'Error') currentInput = '';
            currentInput += key;
        }

        display.innerText = currentInput || '0';
    }

    // Handles unlocking logic
    function checkUnlock(val) {
        if (val.toLowerCase() === 'rubenator2009') {
            document.getElementById('keypad').style.display = 'none';
            document.getElementById('secretInput').style.display = 'none';
            document.getElementById('workspace').style.display = 'block';
            
            const display = document.getElementById('display');
            display.innerText = 'MADE BY YLIAN';
            display.style.color = '#0070f3';
            display.style.fontSize = '1.3rem';
            display.style.textAlign = 'center';
            display.style.fontWeight = 'bold';
        }
    }

    // Listen to the secret input field
    document.getElementById('secretInput').addEventListener('input', function(e) {
        checkUnlock(e.target.value);
    });

    // Secret listener to catch physical typing anywhere on the page
    document.addEventListener('keydown', function(e) {
        // Don't capture keys if they are typing in the URL input box
        if (document.activeElement.id === 'urlInput') return;
        
        if (e.key.length === 1) { // Only standard keys
            globalKeyBuffer += e.key;
            // Keep buffer at reasonable length
            if (globalKeyBuffer.length > 20) globalKeyBuffer = globalKeyBuffer.slice(-20); 
            
            if (globalKeyBuffer.toLowerCase().includes('rubenator2009')) {
                checkUnlock('rubenator2009');
                globalKeyBuffer = ''; // Reset
            }
        }
    });

    // Advanced SW Registration to fix the "Cannot GET" error
    async function registerSW() {
        if (!('serviceWorker' in navigator)) throw new Error('Service Workers disabled on this browser.');
        
        const reg = await navigator.serviceWorker.register('/sw.js', {
            scope: __uv$config.prefix
        });

        // If a worker is actively controlling the page, we're good to go
        if (navigator.serviceWorker.controller) {
            return true;
        }

        // Otherwise, wait for the worker to take over
        return new Promise((resolve) => {
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                resolve(true);
            });
        });
    }

    async function launchWorkspace() {
        let targetUrl = document.getElementById('urlInput').value.trim();
        if (!targetUrl) return;

        // URL Formatting
        if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
            if (targetUrl.includes('.') && !targetUrl.includes(' ')) {
                targetUrl = 'https://' + targetUrl;
            } else {
                targetUrl = 'https://www.google.com/search?q=' + encodeURIComponent(targetUrl);
            }
        }

        const launchBtn = document.querySelector('.btn-launch');
        const display = document.getElementById('display');
        
        if (launchBtn) launchBtn.innerText = 'Activating Tunnel...';

        try {
            // Wait for SW to guarantee it will intercept the request
            await registerSW();

            // Redirect using the UV encoder
            window.location.href = __uv$config.prefix + __uv$config.encodeUrl(targetUrl);

        } catch (err) {
            console.error('Launch Error:', err);
            if (launchBtn) launchBtn.innerText = 'Launch Environment';
            if (display) {
                display.style.color = '#d9383a';
                display.style.fontSize = '1rem';
                display.innerText = 'ERR: ' + err.message;
            }
        }
    }

    function triggerPanic() { 
        window.location.replace("https://google.com/search?q=calculator"); 
    }

    document.getElementById('urlInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') { launchWorkspace(); }
    });
</script>
</body>
</html>
