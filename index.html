<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; background: #111; color: #fff; }
        .nav-bar { height: 50px; background: #222; display: flex; align-items: center; padding: 0 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        input { width: 300px; padding: 5px 10px; border-radius: 4px; border: 1px solid #444; background: #333; color: #fff; }
        iframe { width: 100%; height: calc(100% - 50px); border: none; }
    </style>
</head>
<body>
    <div class="nav-bar">
        <input type="text" id="urlInput" placeholder="Enter URL (e.g., wikipedia.org)..." onkeydown="if(event.key === 'Enter') loadPage()">
    </div>
    <iframe id="proxyFrame" src="https://google.com"></iframe>

    <script>
        function loadPage() {
            let input = document.getElementById('urlInput').value;
            if (!input.startsWith('http://') && !input.startsWith('https://')) {
                input = 'https://' + input;
            }
            // Uses a public, open CORS/proxy wrapper to load into the iframe
            document.getElementById('proxyFrame').src = "https://allorigins.win" + encodeURIComponent(input);
        }
    </script>
</body>
</html>
